    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Orbit Workspace: a thoughtful kanban workspace with local persistence."
    />
    <title>Orbit | Project workspace</title>
    <link rel="stylesheet" href="base.css?v=0aafddc6f3" />
    <link rel="stylesheet" href="styles.css?v=0aafddc6f3" />
  </head>
  <body>
    <header>
      <a class="brand" href="./" style="color: inherit; text-decoration: none"
        ><b>◎</b>orbit<span class="workspace"> / Personal workspace</span></a
      ><span class="mode" id="mode">Connecting…</span>
    </header>
    <main>
      <div class="top">
        <div>
          <p class="eyebrow">WORKSPACE / PRODUCT</p>
          <h1>Good work starts here.</h1>
          <p>A little clarity for your next big idea.</p>
        </div>
        <div class="actions">
          <button id="export">↓ Export board</button
          ><button class="primary" id="new">＋ New task</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="board-head">
        <h2>Product roadmap <span class="muted">/ Board</span></h2>
        <p>Sample workspace · make it your own</p>
      </div>
      <div class="toolbar">
        <input
          id="search"
          type="search"
          aria-label="Search tasks"
          placeholder="⌕  Search tasks, labels, or IDs…"
        /><select id="priority" aria-label="Filter by priority">
          <option>All priorities</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option></select
        ><button id="reset">Reset sample</button>
      </div>
      <div class="board" id="board" aria-label="Task board"></div>
    </main>
    <footer>
      <span>Built by Sa'ood Williams · Node.js / SQLite / JavaScript</span
      ><a href="https://github.com/CACTUSCASH">GitHub ↗</a
      ><a href="https://cactuscash.github.io/saoodwilliams-com/">← Portfolio</a>
    </footer>
    <dialog id="editor">
      <form id="taskForm">
        <div class="panel-head">
          <h2 id="editorTitle">New task</h2>
          <button type="button" id="close" aria-label="Close task editor">
            ×
          </button>
        </div>
        <label
          >Title<input
            name="title"
            required
            maxlength="120"
            placeholder="What needs to happen?" /></label
        ><label
          >Description<textarea
            name="description"
            maxlength="2000"
            placeholder="A little context goes a long way."
          ></textarea></label
        ><label
          >Status<select name="status">
            <option>Backlog</option>
            <option>In progress</option>
            <option>Review</option>
            <option>Done</option>
          </select></label
        ><label
          >Priority<select name="priority">
            <option>Medium</option>
            <option>High</option>
            <option>Low</option>
          </select></label
        ><label
          >Label<input name="tag" maxlength="40" value="Feature" required
        /></label>
        <div class="actions">
          <button type="button" id="delete">Delete task</button
          ><button class="primary" type="submit">Save task</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="app.js?v=0aafddc6f3"></script>
  </body>
</html>
